version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rove-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./reinforcement_learning/models:/app/reinforcement_learning/models
      - ./experiments/results:/app/experiments/results
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rove-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
